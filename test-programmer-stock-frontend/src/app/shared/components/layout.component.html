<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">Sistem Inventory</div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Menu</div>

    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <i class="bi bi-grid-1x2"></i>
      Dashboard
    </a>

    <div class="nav-section-label">Master Data</div>

    <a class="nav-item" routerLink="/barang" routerLinkActive="active">
      <i class="bi bi-box-seam"></i>
      Master Barang
    </a>

    <a class="nav-item" routerLink="/stok-gudang" routerLinkActive="active">
      <i class="bi bi-archive"></i>
      Stok Gudang
    </a>

    <div class="nav-section-label">Transaksi</div>

    <a class="nav-item" routerLink="/transaksi-keluar" routerLinkActive="active">
      <i class="bi bi-arrow-right-circle"></i>
      Barang Keluar
    </a>
  </nav>

  <!-- User di bawah sidebar -->
  <div style="padding: 12px 10px; border-top: 1px solid var(--border)">
    <div
      style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px"
    >
      <div class="avatar">{{ initials }}</div>
      <div style="flex: 1; min-width: 0">
        <div
          style="
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          "
        >
          {{ currentUser?.name }}
        </div>
        <div style="font-size: 11px; color: var(--text-muted)">Administrator</div>
      </div>
      <button class="btn-icon danger" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>
</aside>

<!-- Main -->
<div class="main-content">
  <!-- Topbar -->
  <header class="topbar">
    <span class="topbar-title">{{ pageTitle }}</span>
    <div class="topbar-right">
      <span style="font-size: 12px; color: var(--text-muted)">
        {{ today | date: 'EEEE, d MMM yyyy' }}
      </span>
    </div>
  </header>

  <!-- Content -->
  <div class="page-wrapper">
    <router-outlet></router-outlet>
  </div>
</div>
